[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D USE_SIMULATED_SENSORS=1

[env:native]
platform = native
build_flags = -std=c++17 -Iinclude
test_framework = unity
build_src_filter = +<validator.cpp>
test_build_src = yes